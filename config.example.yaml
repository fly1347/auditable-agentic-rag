# Strict public example. Unknown keys cause startup failure.
mode: query
corpus_root: sample_data/corpus
artifacts_dir: artifacts
topk: 5
log_dir: logs
execution:
  default_profile: baseline
  enabled_profiles: [baseline, orchestrated]
  debug_trace_enabled: true
  judge_profile: deepseek_judge
  orchestrated_sufficiency_mode: structured
auth:
  mode: static_token
  required: true
  header_name: X-API-Key
  principals_env: AGENTIC_RAG_STATIC_PRINCIPALS_JSON
  public_paths: [/health, /api/version]
admin: {enabled: false, allowed_roles: [admin], max_upload_bytes: 2000000}
egress:
  public_cloud_allowed: true
  restricted_cloud_allowed: false
  cloud_providers: [openrouter, deepseek]
  local_providers: [ollama, local_llama_cpp, local]
records: {enabled: true, path: artifacts/executions/records.jsonl, schema_version: 1.0.0}
index:
  vector_store_dir: artifacts/vector_store
  manifest_path: artifacts/index/manifest.json
  acl_registry_path: policy/source_acl.yaml
prompt: {max_chunks: 5, max_chars_per_chunk: null, context_token_budget: 4096}
citation: {syntax: evidence_marker, missing_policy: record, allow_system_fallback: false}
rerank:
  enabled: false
  model: BAAI/bge-reranker-base
  candidate_topk: 5
  topn: 5
  selective_enabled: false
  selective_gap_threshold: 0.05
  selective_apply_on_first_round: true
  selective_apply_on_second_round: true
generator:
  default_profile: openrouter_gpt4o_mini
  fallback_chain: []
  profiles:
    openrouter_gpt4o_mini:
      name: openrouter_gpt4o_mini
      backend: openai_compatible
      model: openai/gpt-4o-mini
      base_url: https://openrouter.ai/api/v1
      api_key_env: OPENROUTER_API_KEY
      provider_tag: openrouter
      timeout_s: 120
      max_retries: 2
      max_tokens: 512
      temperature: 0
      top_p: 1
    deepseek_judge:
      name: deepseek_judge
      backend: openai_compatible
      model: deepseek-v4-flash
      base_url: https://api.deepseek.com
      api_key_env: DEEPSEEK_API_KEY
      provider_tag: deepseek
      timeout_s: 120
      max_retries: 0
      max_tokens: 512
      temperature: 0
      top_p: 1
