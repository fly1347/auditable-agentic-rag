[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "auditable-agentic-rag"
version = "0.1.0"
description = "Enterprise-oriented local-first Agentic RAG system with evaluation, ACL, audit-safe logging, safety baseline, cost hooks, API/UI, and Docker support."
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "fastapi>=0.100",
    "uvicorn[standard]>=0.23",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
    "PyYAML>=6.0",
    "numpy>=1.24",
    "requests>=2.31",
]

[project.optional-dependencies]
ui = [
    "streamlit>=1.30",
    "pandas>=2.0",
]
local = [
    "sentence-transformers>=2.2",
    "transformers>=4.35",
    "jieba>=0.42",
    "rank-bm25>=0.2.2",
]
loadtest = [
    "locust>=2.20",
]
ragas = [
    "ragas==0.4.3",
    "datasets==4.8.5",
    "langchain==1.3.16",
    "langchain-core==1.6.0",
    "langchain-community==0.3.31",
    "langchain-openai==1.6.0",
    "langchain-huggingface==1.2.2",
]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"agentic_rag" = [
    "prompts/*",
]
